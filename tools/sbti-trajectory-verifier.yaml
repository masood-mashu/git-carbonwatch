name: sbti-trajectory-verifier
version: 1.0.0
description: "Verifies whether annual emission reductions meet the SBTi 1.5C minimum 4.2% annual reduction rate"
input_schema:
  type: object
  properties:
    reduction_data_json:
      type: string
      description: "JSON string containing baseline_year_emissions and current_year_emissions"
  required:
    - reduction_data_json
implementation:
  type: script
  path: sbti_trajectory_verifier.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
